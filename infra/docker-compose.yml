
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: etfinsight
      POSTGRES_USER: etfinsight
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../src/api/EtfInsight.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=etfinsight;Username=etfinsight;Password=devpassword123
    depends_on:
      - postgres

volumes:
  postgres_data: