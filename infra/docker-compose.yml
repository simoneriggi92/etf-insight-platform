x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # ETF DB — mirrors existing POSTGRES_* env vars used by scraper/ingestor
    ETF_DB_HOST: postgres
    ETF_DB_PORT: 5432
    ETF_DB_NAME: ${POSTGRES_DB}
    ETF_DB_USER: ${POSTGRES_USER}
    ETF_DB_PASSWORD: ${POSTGRES_PASSWORD}
    # .NET API webhook — mirrors DATA_QUALITY_WEBHOOK_URL in load_to_db.py
    DATA_QUALITY_WEBHOOK_URL: http://etf-api:8080/api/data-quality/scan
    DOTNET_API_CALLBACK_URL: http://etf-api:8080/api/ingestion/callback
    AIRFLOW_CALLBACK_SECRET: ${CALLBACK_SECRET:-dev-callback-secret-changeme}
    # Backfill date range — mirrors BACKFILL_FROM/BACKFILL_TO in .env
    BACKFILL_FROM: ${BACKFILL_FROM:-2024-01-01}
    BACKFILL_TO: ${BACKFILL_TO:-2026-02-28}
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    _PIP_ADDITIONAL_REQUIREMENTS: "yfinance==1.2.0 pandas==2.2.2 pytest==8.2.0"
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - ../airflow/include:/opt/airflow/include
    - airflow_logs:/opt/airflow/logs
    - ../airflow/tests:/opt/airflow/tests
  depends_on:
    postgres-airflow:
      condition: service_healthy
  networks:
    - etf-network

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: etf-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etfinsight}
      POSTGRES_USER: ${POSTGRES_USER:-etfinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/db:/docker-entrypoint-initdb.d:ro
    networks:
      etf-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etfinsight} -d ${POSTGRES_DB:-etfinsight}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: etf-redis
    hostname: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      etf-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etf_api:
    build:
      context: ../src
      dockerfile: EtfInsight.Api/Dockerfile
    container_name: etf-api
    hostname: etf-api
    ports:
      - "${API_PORT:-5001}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-etfinsight};Username=${POSTGRES_USER:-etfinsight};Password=${POSTGRES_PASSWORD:-devpassword123}
      - AI__OllamaUrl=http://host.docker.internal:11434 # Adjust if Ollama is running elsewhere
      - AI__EmbeddingModel=nomic-embed-text 
      - DataQuality__FlashCrashThresholdPercent=20.0
      - DataQuality__EnableAutoScan=true
      - DataQuality__ScanIntervalMinutes=5
      - Airflow__BaseUrl=${AIRFLOW_API_URL:-http://etf-airflow-webserver:8080}
      - Airflow__Username=${AIRFLOW_USER:-admin}
      - Airflow__Password=${AIRFLOW_PASS:-admin}
      - Airflow__CallbackSecret=${CALLBACK_SECRET:-dev-callback-secret-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      etf-network:
        aliases:
          - etf-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: etf-frontend
    ports:
      - "3000:80"          # http://localhost:3000
    depends_on:
      - etf_api
    networks:
      - etf-network
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  postgres-airflow:
    image: postgres:16
    container_name: etf-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432" # Avoid conflict with main Postgres on 543
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etf-network

  airflow-init:
    <<: *airflow-common
    container_name: etf-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_USER:-admin} \
          --password ${AIRFLOW_PASS:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@etf-insight.local
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: etf-airflow-webserver
    command: bash -c "rm -f /opt/airflow/airflow-webserver.pid && airflow webserver"
    ports:
      - "8090:8080"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - etf-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: etf-airflow-scheduler
    command: scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - etf-network
    restart: unless-stopped

networks:
  etf-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_airflow_data:
  airflow_logs: