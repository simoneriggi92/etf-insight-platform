services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: etf-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etfinsight}
      POSTGRES_USER: ${POSTGRES_USER:-etfinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/db:/docker-entrypoint-initdb.d:ro
    networks:
      etf-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etfinsight} -d ${POSTGRES_DB:-etfinsight}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: etf-redis
    hostname: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      etf-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etf_api:
    build:
      context: ../src
      dockerfile: EtfInsight.Api/Dockerfile
    container_name: etf-api
    hostname: etf-api
    ports:
      - "${API_PORT:-5001}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-etfinsight};Username=${POSTGRES_USER:-etfinsight};Password=${POSTGRES_PASSWORD:-devpassword123}
      - AI__OllamaUrl=http://host.docker.internal:11434 # Adjust if Ollama is running elsewhere
      - AI__EmbeddingModel=nomic-embed-text 
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      etf-network:
        aliases:
          - etf-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  etf_prices_scraper:
    build:
      context: ../src/ingestion
      dockerfile: Dockerfile
      target: scraper
    container_name: etf-prices-scraper
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-etfinsight}
      - POSTGRES_USER=${POSTGRES_USER:-etfinsight}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpassword123}
      - PERIOD=${PERIOD:-5d}
      - SCRAPER_INTERVAL_MINUTES=${SCRAPER_INTERVAL_MINUTES:-2}
    volumes:
      - etf_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etf-network
    restart: unless-stopped
    stop_grace_period: 30s # Wait up to 30 seconds for graceful shutdown

  etf_prices_ingestor:
    build:
      context: ../src/ingestion
      dockerfile: Dockerfile
      target: ingestor
    container_name: etf-prices-ingestor
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-etfinsight}
      - POSTGRES_USER=${POSTGRES_USER:-etfinsight}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpassword123}
      - INGESTOR_INTERVAL_MINUTES=${INGESTOR_INTERVAL_MINUTES:-1}
    volumes:
      - etf_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etf-network
    restart: unless-stopped
    stop_grace_period: 30s # Wait up to 30 seconds for graceful shutdown
networks:
  etf-network:
    driver: bridge

volumes:
  postgres_data:
  etf_data: