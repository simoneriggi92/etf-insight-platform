version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: etf-insight-postgres
    environment:
      POSTGRES_USER: etfinsight
      POSTGRES_DB: etfinsight
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5433:5432"
    volumes:
      - etf_insight_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: etf-insight-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
